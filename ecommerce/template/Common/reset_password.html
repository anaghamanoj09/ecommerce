<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap.css"> 
    <script src="/static/js/bootstrap.bundle.js"></script>
</head>
<body>
    <div class="header-nav">
        <nav class="navbar navbar-expand-lg navbar-light bg-success">
            <ul class="navbar-nav ms-auto order-5">  
                <li class="nav-item"><a href="{% url 'login_user' %}" class="nav-link">Login</a></li>
                <li class="nav-item"><a href="{% url 'register' %}" class="nav-link">Register</a></li>
            </ul>
        </div>
    </div>
    <div class="container">
        <form  method="post">
            {% csrf_token %}
        <div  style="padding-top: 15%; padding-left: 25%;">
            <div class="row">
                <div class="col-6">
                    <h4 style="text-align: center; padding-bottom: 10%; color: rgb(3, 37, 73);padding-top: 20px;">Reset Password</h4>
                    <table width="100%">
                        <tr>
                            <th>New Password</th>
                            <td><input type="password" class="form-control"  name="new" id=""></td>
                        </tr>
                        <tr>
                            <th>Confirm Password</th>
                            <td><input type="password" class="form-control" name="confirm" id=""></td>
                        </tr>
                    </table>
                    <div style="padding-top: 5%;text-align: center;">
                        <input style="color: beige; background-color: rgb(3, 37, 73);" class="form-control" type="submit" value="Reset">
                    </div>
                </div>
            </div>
        </div>
    </form>
    </div>
<footer class="bg-success text-center fixed-bottom">
    <h5>Fit-Check @Copyright</h5>
</footer>
{% if messages %}
{% for m in messages %}
<script>
    alert('{{m}}')
</script>
{% endfor %}
{% endif %}
</body>
</html>
