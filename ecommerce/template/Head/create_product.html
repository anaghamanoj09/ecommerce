{% extends 'Head/headbase.html' %}
{% block content %}
<body>
    <div class="container" style="min-height: 625px;">
            <div style="color: chocolate;">
                <h3>Create Product</h3>
            </div>
    <form action="{% url 'create_product' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row mt-3">
            <div class="col-3">
                <label for="">Name</label>
            </div>
            <div class="col-lg-3">
                <input type="text" name="name" class="form-control" id="">
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-3">
                <label for="">Description</label>
            </div>
            <div class="col-lg-3">
                <input type="text" name="description" class="form-control" id="">
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-3">
                <label for="">List Price</label>
            </div>
            <div class="col-lg-3">
                <input type="text" name="lprice" class="form-control" id="">
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-3">
                <label for="">Price</label>
            </div>
            <div class="col-lg-3">
                <input type="text" name="price" class="form-control" id="">
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-3">
                <label for="">Price 50</label>
            </div>
            <div class="col-lg-3">
                <input type="text" name="price50" class="form-control" id="">
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-3">
                <label for="">Price 100</label>
            </div>
            <div class="col-lg-3">
                <input type="text" name="price100" class="form-control" id="">
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-3">
                <label for="">Category</label>
            </div>
            <div class="col-lg-3">
                <select name="category" id="" class="form-control">
                    <option value="">--select category--</option>
                    {% for d in da %}
                    <option value="{{d.id}}">{{d.c_name}}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-3">
                <label for="">Material Type</label>
            </div>
            <div class="col-lg-3">
                <select name="materialtype" id="" class="form-control">
                    <option value="">--select material type--</option>
                    {% for i in ua %}
                    <option value="{{i.id}}">{{i.material_type}}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-3">
                <label for="">Image</label>
            </div>
            <div class="col-lg-3">
                <input type="file" type="submit" name="image" id="" class="form-control" value="Choose a image">
            </div>
        </div>
        <div class="row mt-3">
            <div class="offset-3 col-2">
                <button type="submit" class="btn btn-primary form-control">Create</button>
            </div>
            <div class="col-2">
                <a href="{% url 'back_list' %}" class="btn btn-primary form-control">Back To List</a>
            </div>
        </div>
    </form>
    </div>
</body>



{% endblock %}
