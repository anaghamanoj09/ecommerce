{% extends 'Customer/customerbase.html' %}
{% block content %}
<body>
    <div class="container" style="min-height: 610px;">
        <div class="card mt-3">
            <div class="card-header text-center" style="font-weight: bolder;color: cornflowerblue;font-size: larger;">
                <label for="">Profile</label>
            </div>
        <form action="{% url 'my_account' %}" method="post">
            {% csrf_token %}
        <div style="padding-left: 233px;padding-top: 21px;">
            <div class="row">
                <div class="col-6">
                    <label for="">Name</label>
                    <input type="text" name="name" value="{{user.first_name}}  " class="form-control" id=""><br>
                    <label for="">Phone</label>
                    <input type="number" name="phone" value="{{customer.Phone}}" class="form-control" id=""><br>
                    <label for="">Address</label>
                    <input type="text" name="address" value="{{customer.Address}}" class="form-control" id=""><br>
                    <label for="">City</label>
                    <input type="text" name="city" value="{{customer.City}}" class="form-control" id=""><br>
                    <label for="">Post</label>
                    <input type="number" name="post" value="{{customer.Postal}}" class="form-control" id=""><br>
                    <label for="">Username</label>
                    <input type="text" value="{{user.username}}" name="username" class="form-control" id=""><br>
                    <label for="">Email</label>
                    <input type="text" class="form-control" value="{{user.email}}" name="email" id="">
                <div style="text-align: center;padding-top: 6px;padding-bottom: 4px;">
                    <input type="submit" value="Update" class="form-control" style="color: crimson;font-weight: bolder;">
                </div>
            </div>
            </div>
        </div>
    </form>
</div>
    </div>
    {% if messages %}
    {% for m in messages %}
    <script>
        alert('{{m}}')
    </script>
    {% endfor %}
    {% endif %}
</body>
{% endblock %}
