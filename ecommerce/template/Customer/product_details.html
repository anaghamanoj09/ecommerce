{% extends 'Customer/customerbase.html' %}
{% block content %}
<body>
    <div class="container">
        <div class="card mt-3">
            <div class="card-header">
                <div class="row mt-4">
                <div class="col-9">
                {% for u in us %}
            <form action="{% url 'add_tocart' u.id %}" method="post" enctype="multipart/form-data" >
                {% csrf_token %}
                    <h4 style="color: blue;">{{u.name}}</h4>
                </div>
                <div class="col-3">
                    <button class="badge text-dark" style="background-color: rgb(157, 190, 23);">{{u.category.c_name}}</button>
                    <button class="badge text-dark" style="background-color: rgb(157, 190, 23);" >{{u.materialtype.material_type}}</button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-3">
                    <h6 style="color: grey;">Listprice:<s>{{u.listprice}}</s></h6>
                </div>
                <div class="row mt-3">
                <div class="col-2">
                    <label for="">Quantity</label>
                </div>
                <div class="col-3">
                    <label for="">1-49</label>
                </div>
                <div class="col-3">
                    <label for="">50-99</label>
                </div>
                <div class="col-3">
                    <label for="">100+</label>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-2">
                    <label for="">Price</label>
                </div>
                <div class="col-3">
                    <label for="">{{u.price}}</label>
                </div>
                <div class="col-3">
                    <label for="">{{u.price50}}</label>
                </div>
                <div class="col-3">
                    <label for="">{{u.price100}}</label>
                </div>
            </div>
            <div class="col-9 mt-5">
                <label for="">Count</label>
                <input type="number" name="count" id="" class="form-control">
            </div>
            <div class="col-3">
                <img src="{{u.image.url}}" height="150px" width="150px">
            </div>
        </div>
        </div> 
        <div class="card-footer">
            <div class="row">
                <div class="col-6">
                <button class="btn-outline-dark btn-success form-control" type="submit">Back To List</button>  
                </div>
                    <div class="col-6">
                        <button class="btn btn-success form-control" type="submit">Add to cart</button>
                    </div>
            </div>
        </div>
        {% endfor %}
    </form>
    </div>
    </div>
</body>








{% endblock %}
